[project]
name = "jev-demo"
version = "0.1.0"
description = "Single-model vs Jev-routed Cortex Agent benchmark (cost, latency, tokens, quality)"
authors = [
    { name = "Jorge Garcia", email = "jorge.garcia@snowflake.com" }
]
requires-python = ">=3.12.15"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
jev-demo = "jev_demo.runner:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
